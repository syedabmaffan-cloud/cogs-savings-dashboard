name: Refresh COGS data

# Rebuilds docs/data.json (+ docs/index.html) from the iBOS MCP server and the budget
# Google Sheet, then commits. GitHub Pages serves the updated site automatically.
#
# Runs every 2 hours so it recovers automatically when the MCP gateway is available.
# If the gateway is unavailable (502), the extract step is soft-skipped, the published
# data is left unchanged, and the dashboard shows a staleness banner.
#
# Required repository secrets:
#   COGS_MCP_URL, COGS_MCP_TOKEN   (enterprise-api-gateway bearer)
#   COGS_GCLIENT_ID, COGS_GCLIENT_SECRET, COGS_GREFRESH
#   (optional legacy: COGS_MCP_KEY)

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cogs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract actuals + budget
        id: extract
        continue-on-error: true
        shell: pwsh
        env:
          COGS_MCP_URL:        ${{ secrets.COGS_MCP_URL }}
          COGS_MCP_TOKEN:      ${{ secrets.COGS_MCP_TOKEN }}
          COGS_MCP_KEY:        ${{ secrets.COGS_MCP_KEY }}
          COGS_GCLIENT_ID:     ${{ secrets.COGS_GCLIENT_ID }}
          COGS_GCLIENT_SECRET: ${{ secrets.COGS_GCLIENT_SECRET }}
          COGS_GREFRESH:       ${{ secrets.COGS_GREFRESH }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/cogs-extract.ps1

      - name: Build dashboard
        if: hashFiles('.opencode/logs/cogs-data.json') != ''
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/cogs-build.ps1

      - name: Commit refreshed data
        if: hashFiles('.opencode/logs/cogs-data.json') != ''
        shell: pwsh
        run: |
          git config user.name  "cogs-refresh-bot"
          git config user.email "cogs-refresh-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: refresh COGS data $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          } else {
            Write-Host "No data changes."
          }

      - name: Notice when skipped
        if: hashFiles('.opencode/logs/cogs-data.json') == ''
        shell: pwsh
        run: Write-Host "::warning::COGS refresh skipped - MCP gateway unavailable (502). Published data left unchanged."
